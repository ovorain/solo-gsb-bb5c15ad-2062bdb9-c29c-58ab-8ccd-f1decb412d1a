services:
  coldchain-planner:
    build: .
    image: coldchain-planner:latest
    container_name: coldchain-planner
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # 交接台账 SQLite 数据库文件位置(容器内),默认挂在命名卷上持久化
      - HANDOVER_DB_PATH=${HANDOVER_DB_PATH:-/data/handover.db}
    volumes:
      # 数据库持久化卷:重启/重建容器后交接单与签收记录仍在
      - handover-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  handover-data:
